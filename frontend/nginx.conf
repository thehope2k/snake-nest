server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # API/WS calls never reach this container directly in production -- Caddy
    # routes /api and /ws straight to the backend. This block only serves the
    # built SPA, with a fallback to index.html for client-side routes.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:js|css|svg|png|jpg|jpeg|gif|webp|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }
}
