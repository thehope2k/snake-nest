name: CD

# Deploys on every push to main -- develop is the default working branch,
# main is reserved for what's actually live. Merge develop -> main to ship.
on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image-tag: ${{ steps.tag.outputs.value }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute image tag
        id: tag
        run: echo "value=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}-backend:${{ steps.tag.outputs.value }}
            ${{ env.REGISTRY }}/${{ github.repository }}-backend:latest

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          build-args: |
            VITE_API_URL=/api/v1
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}-frontend:${{ steps.tag.outputs.value }}
            ${{ env.REGISTRY }}/${{ github.repository }}-frontend:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: SSH deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          # DEPLOY_PATH: where the repo is checked out on the VM (see
          # infra/README.md's one-time setup). Defaults to ~/snake-nest.
          script: |
            set -e
            cd "${DEPLOY_PATH:-$HOME/snake-nest}/infra"
            export IMAGE_TAG="${{ needs.build-and-push.outputs.image-tag }}"
            export GITHUB_REPOSITORY="${{ github.repository }}"
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            docker image prune -f
