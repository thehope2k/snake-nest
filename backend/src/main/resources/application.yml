spring:
  application:
    name: nest-backend

  autoconfigure:
    exclude:
      - org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:nest}
    username: ${DB_USER:nest}
    password: ${DB_PASSWORD:nest}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

nest:
  jwt:
    # Local-dev-only default. Real deployments MUST override via JWT_SECRET env var --
    # never commit a production secret.
    secret: ${JWT_SECRET:tzWNrUJcU5MD2FKOrBmQhVJSIJ9DYUfb9S5gEftnLwA=}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:10080}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  livekit:
    url: ${LIVEKIT_URL:ws://localhost:7880}
    # devkey/secret match LiveKit's `--dev` mode fixed pair -- local dev only, never use in a real deployment.
    api-key: ${LIVEKIT_API_KEY:devkey}
    api-secret: ${LIVEKIT_API_SECRET:secret}
  doghouse:
    duration-seconds: ${DOGHOUSE_DURATION_SECONDS:60}
    cooldown-seconds: ${DOGHOUSE_COOLDOWN_SECONDS:30}
    # Cap on how many participants can be benched at once, as a fraction of everyone
    # currently on the call -- the anti-pile-on limit from docs/product/principles.md.
    max-concurrent-ratio: ${DOGHOUSE_MAX_CONCURRENT_RATIO:0.5}

management:
  endpoints:
    web:
      exposure:
        include: health,info
