databaseChangeLog:
  - changeSet:
      id: 006-create-message-reaction
      author: nest
      changes:
        - createTable:
            tableName: message_reaction
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: message_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: user_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: emoji
                  type: varchar(16)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamp with time zone
                  constraints:
                    nullable: false
        - addUniqueConstraint:
            tableName: message_reaction
            columnNames: message_id, user_id, emoji
            constraintName: uk_message_reaction_message_user_emoji
        - createIndex:
            tableName: message_reaction
            indexName: idx_message_reaction_message_id
            columns:
              - column:
                  name: message_id
