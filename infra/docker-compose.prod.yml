# Production deploy for a single self-hosted VM (see ../docs/architecture.md).
#
# Unlike infra/docker-compose.yml (local dev, builds from source), this pulls
# prebuilt images from GHCR -- the CD workflow (.github/workflows/cd.yml)
# pushes new images on every merge to main, then tells the VM to pull+recreate.
#
# Requires a `.env` file next to this one on the VM (never committed -- see
# .env.example) with real secrets: DB_PASSWORD, JWT_SECRET, LIVEKIT_API_KEY,
# LIVEKIT_API_SECRET, and SITE_ADDRESS.
#
# Memory budget note: this stack targets a 1GB Always-Free VM.Standard.E2.1.Micro
# as a stopgap while waiting on A1.Flex capacity. Every service below has an
# explicit mem_limit so a runaway container gets OOM-killed and restarted by
# Docker (recoverable) instead of exhausting host RAM and freezing the whole
# VM unresponsive (which happened before these limits were added). Revisit/
# raise these once running on a bigger instance.
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    mem_limit: 160m
    command: ["postgres", "-c", "shared_buffers=48MB", "-c", "max_connections=20", "-c", "work_mem=4MB"]
    environment:
      POSTGRES_DB: nest
      POSTGRES_USER: nest
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
    volumes:
      - nest-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nest -d nest"]
      interval: 5s
      timeout: 5s
      retries: 10
    # No host port mapping -- only reachable by other containers on this
    # compose network, never exposed on the VM's public interface.

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    mem_limit: 64m
    command: ["redis-server", "--maxmemory", "32mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  livekit:
    image: livekit/livekit-server:v1.9
    restart: unless-stopped
    mem_limit: 120m
    # --dev mode's fixed devkey/secret pair is local-dev-only (see
    # infra/README.md). A real deployment needs a generated key/secret pair
    # and its own livekit.yaml (TURN/TLS) -- tracked as a follow-up, not
    # solved by this compose file yet.
    command: --dev --bind 0.0.0.0
    ports:
      - "7881:7881"
      - "7882:7882/udp"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:7880/"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: ghcr.io/${GITHUB_REPOSITORY:-thehope2k/snake-nest}-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    mem_limit: 380m
    environment:
      # JAVA_TOOL_OPTIONS is auto-picked-up by any JVM launch (no Dockerfile/
      # entrypoint change needed). Caps heap well under the container's
      # mem_limit, leaving room for JVM non-heap (metaspace, thread stacks,
      # code cache) -- without this the JVM's ergonomic default (~25% of
      # visible host RAM) kept growing until the box ran out of memory.
      # MaxMetaspaceSize was previously 80m and caused severe GC thrashing
      # (Spring Boot + Hibernate + Liquibase class loading needs more headroom
      # than that -- startup took 10+ minutes instead of ~30s, CPU pegged at
      # ~1000% from GC threads fighting for metaspace). 200m gives it room;
      # heap stays modest since that's not what was actually undersized.
      JAVA_TOOL_OPTIONS: "-Xmx140m -Xss256k -XX:MaxMetaspaceSize=200m"
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: nest
      DB_USER: nest
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CORS_ALLOWED_ORIGINS: ${SITE_ORIGIN:?SITE_ORIGIN must be set in .env, e.g. https://nest.example.com}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env}
      LIVEKIT_URL: ${LIVEKIT_URL:?LIVEKIT_URL must be set in .env, e.g. wss://nest.example.com (same origin Caddy proxies /rtc on)}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:?LIVEKIT_API_KEY must be set in .env}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:?LIVEKIT_API_SECRET must be set in .env}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      livekit:
        condition: service_healthy

  frontend:
    image: ghcr.io/${GITHUB_REPOSITORY:-thehope2k/snake-nest}-frontend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    mem_limit: 32m
    depends_on:
      - backend

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    mem_limit: 64m
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    environment:
      # No domain yet -- SITE_ADDRESS defaults to plain HTTP on port 80 (works
      # against the VM's bare IP). Set SITE_ADDRESS=nest.example.com in .env
      # once a domain is pointed here and Caddy issues a real cert automatically.
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    depends_on:
      - backend
      - frontend

volumes:
  nest-postgres-data:
  caddy-data:
  caddy-config:
